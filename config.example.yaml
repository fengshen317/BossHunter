# BossHunter 配置文件
# 复制此文件为 config.yaml 并修改为你的实际配置

profile:
  resume_path: "./resume.md"
  resume_output_dir: "./data/resumes"
  # 可选：本地头像，仅用于 PDF 排版，不会发送给 AI
  avatar_path: "./data/avatar.jpg"
  target_roles: ["你的目标岗位1", "目标岗位2", "目标岗位3"]
  target_cities: ["北京"]
  salary_min: 15  # K
  salary_max: 25  # K
  allow_internship: false
  deal_breakers: ["外包", "996"]
  allow_internship: false
  # 可选：个人亮点（用于招呼语生成）
  extra_highlights:
    - "你的核心竞争力描述"
  # 可选：在线作品集链接
  portfolio_url: ""

search:
  keywords: ["关键词1", "关键词2"]
  cities: ["北京"]
  max_pages: 5
  sort: newest

scoring:
  threshold: 70
  max_candidates: 20
  # AI 深度评分并发数。默认 3；过高可能触发模型服务限流。
  concurrency: 3
  # 注册资本硬性下限（万）。预筛阶段排除明确低于该值的岗位；缺失/未补全不排除。
  # 需先运行 bosshunter reenrich 补全企业信息，该过滤才会真正生效。
  min_registered_capital_wan: 50

throttle:
  daily_limit: 30
  interval_min: 60
  interval_max: 180
  # 启用后仅在岗位页显示 HR「在线」或「刚刚活跃」时发送招呼语。
  only_send_when_hr_online: false
  browse_before_greet: true
  browse_duration_min: 15
  browse_duration_max: 30
  send_windows:
    - "09:00-17:00"
  day_off_probability: 0.05
  # 发送招呼失败时的自愈策略。临时性失败（运行时抖动、页面慢加载、选择器
  # 漂移）会先在岗位内重试 send_max_retries 次；仍失败的岗位退避
  # send_error_recover_seconds 后自动重回队列，最多重试 send_error_max_retries
  # 次，超过则永久 error，需到工作台手动重试。
  send_max_retries: 2
  send_retry_backoff_min: 5
  send_retry_backoff_max: 10
  auto_recover_send_errors: true
  send_error_recover_seconds: 600
  send_error_max_retries: 3

ai:
  provider: "openai_compatible"
  model: "deepseek-chat"
  greeting_review_threshold: 7
  greeting_max_iterations: 2
  # 招呼语生成的并发线程数（默认 4）。调大可加速批量生成，但过高会触发 AI 接口的速率限制。
  greeting_concurrency: 4
  # 单次 AI 请求超时（秒，默认 180）。推理模型（如 deepseek-v4-flash）思维链较长，
  # 或简历生成这类长输出场景，建议 ≥120；过短会触发 "The read operation timed out"。
  request_timeout: 180
  # AI 请求遇到 5xx/429/网络瞬时错误时的最大重试次数（默认 3，范围 0-5）。
  # 设 0 可禁用重试（快速失败）。DeepSeek 高峰期偶发 503 时，默认值会自动指数退避重试。
  http_max_retries: 3
  resume_max_pages: 3
  # api_key 通过环境变量 ANTHROPIC_API_KEY 设置，或在此填写
  # api_key: "your-api-key"
  # base_url: "https://api.anthropic.com"

# 简历视觉模板：modern（现代编辑风）、executive（稳重商务）或 ats（纯单栏）
resume:
  template: "modern"
  theme_color: "#0F766E"
  show_avatar: true
  # 同时生成一份无头像、易于招聘系统解析的 ATS PDF
  generate_ats_version: true

monitor:
  interval: 30
  chat_url: "https://www.zhipin.com/web/geek/chat"
  auto_reply_hr_questions: false

follow_up:
  enabled: false
  interval_hours: 30
  skip_weekends: true

dedup:
  history_file: "./data/history.jsonl"

browser:
  runtime: "builtin"
  proxy_host: "127.0.0.1"
  proxy_port: 3456
  chrome_ports: [9222, 9229, 9333]
  # 一键启动优先使用 Chrome；找不到时自动尝试 Edge
  preferred_browser: "auto"
  # executable_path: "C:/Program Files/Google/Chrome/Application/chrome.exe"
  user_data_dir: "./data/browser-profile"
  auto_start_proxy: true
  enable_port_guard: true
  site_patterns: true
