name: bosshunter

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: bosshunter
      POSTGRES_USER: bosshunter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先运行 Browser Connector init 生成 .env.docker}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bosshunter -d bosshunter"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
    image: bosshunter:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOSSHUNTER_DATABASE_URL: postgresql://bosshunter:${POSTGRES_PASSWORD}@postgres:5432/bosshunter
      BOSSHUNTER_BROWSER_PROXY_HOST: host.docker.internal
      BOSSHUNTER_BROWSER_PROXY_PORT: ${BOSSHUNTER_BROWSER_PROXY_PORT:-3456}
      BOSSHUNTER_BROWSER_PROXY_TOKEN: ${BOSSHUNTER_BROWSER_PROXY_TOKEN:?请先运行 Browser Connector init 生成 .env.docker}
      BOSSHUNTER_BROWSER_RUNTIME: external
      BOSSHUNTER_BROWSER_AUTO_START_PROXY: "false"
    ports:
      - "127.0.0.1:8686:8686"
    volumes:
      - ./docker-data:/app/runtime
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
