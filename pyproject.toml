[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bosshunter"
version = "2.0.0"
description = "BOSS直聘智能求职Agent - 端到端自动化求职工具"
requires-python = ">=3.11"
license = "LicenseRef-BossHunter-NonCommercial"
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "patchright>=1.58.2",
    "rich>=13.0",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "markdown2>=2.4",
    "bottle>=0.13",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "deepagents>=0.6,<0.7",
    "langchain-openai>=1.2,<2",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.2,<7",
    "dramatiq[redis]>=1.17,<3",
    "boto3>=1.35,<2",
]

[project.optional-dependencies]
pdf = [
    "xhtml2pdf>=0.2.11",
]

[project.scripts]
bosshunter = "bosshunter.main:cli"
bosshunter-server = "bosshunter.backend:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bosshunter"]
artifacts = [
    "src/bosshunter/browser/runtime/*.mjs",
    "src/bosshunter/browser/runtime/site-patterns/*.md",
    "src/bosshunter/web/frontend/dist/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
indent-style = "tab"
